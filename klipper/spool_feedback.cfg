# spool_feedback.cfg -- optional beeps for spool_cam_scanner.
#
# You do NOT need this file for the scanner to work. It only gives audible feedback at the
# printer, for when you can't see the Mainsail/Fluidd screen. Scans work the same without it.
#
# Setup, on EACH printer that should beep:
#   1. Put this file in the printer's config folder (next to printer.cfg).
#      In Mainsail/Fluidd: upload it, or create spool_feedback.cfg and paste this in.
#   2. Add this line to printer.cfg:
#          [include spool_feedback.cfg]
#   3. Save & Restart Klipper, then press the macro buttons to test them.
#   4. Tell the scanner to use them (config.json -> "feedback" -> "gcode"; see docs/feedback.md).
#
# !!! IMPORTANT: keep these macros to BEEPS and LIGHTS only. NEVER add movement (G0, G1, G28,
# ...), heater or fan changes. The scanner also runs them while a print is PAUSED (for example during
# a colour change), when the head is parked over the print, so a move here could ruin the print or
# damage the printer. (They are never run while a printer is printing.)
#
# The scanner calls these macros (see "feedback" -> "gcode" in config.json).
# They need an M300 beep macro backed by a buzzer pin; many printers already have
# one -- type M300 in the console to check. If your printer has no buzzer, delete the
# M300 lines and use SET_LED (or nothing) instead.
#
# Sounds differ by RHYTHM, not just pitch, so they stay distinguishable even on
# buzzers that play every pitch the same.
#   S = pitch in Hz, P = length in ms, "S0" = silence

[gcode_macro SPOOL_SCAN_OK]
description: Two quick blips - spool label read and assigned
gcode:
    M300 S2000 P50
    M300 S0 P70
    M300 S2000 P50

[gcode_macro SPOOL_SCAN_CLEARED]
description: One longer low beep - spool removed
gcode:
    M300 S1200 P300

[gcode_macro SPOOL_SCAN_ERROR]
description: Three fast low beeps - label read but spool not in Spoolman
gcode:
    M300 S800 P90
    M300 S0 P70
    M300 S800 P90
    M300 S0 P70
    M300 S800 P90

# Example M300 macro for printers that don't have one (set the pin for YOUR board; the known pins for
# some common printers and how to find yours are in docs/feedback.md, "Finding your beeper pin"):
#
# [output_pin beeper]
# pin: PC6
# pwm: True
# value: 0
# shutdown_value: 0
# cycle_time: 0.001
#
# [gcode_macro M300]
# gcode:
#     {% set S = params.S|default(1000)|int %}
#     {% set P = params.P|default(100)|int %}
#     {% if S > 0 %}
#         SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0 / S }
#         G4 P{P}
#     {% else %}
#         G4 P{P}
#     {% endif %}
#     SET_PIN PIN=beeper VALUE=0
