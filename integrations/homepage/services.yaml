# Homepage (https://gethomepage.dev) - add to services.yaml. Replace SCANNER_IP.
# The Custom API widget reads the scanner's JSON; nested values use dot notation.

- Filament:
    - Spool Scanner:
        icon: mdi-qrcode-scan
        href: http://SCANNER_IP:8090/
        description: Camera spool assignment
        widget:
          type: customapi
          url: http://SCANNER_IP:8090/api/summary
          refreshInterval: 5000
          mappings:
            - field: printers_online
              label: Cameras up
            - field: printers_with_spool
              label: With spool
            - field: last_event
              label: Last scan

    # Optional: one tile showing which spool is on the FIRST printer in config.json.
    # Change the 0 to 1, 2, ... for the others (same order as "printers" in config.json).
    - Printer 1 spool:
        icon: mdi-printer-3d
        href: http://SCANNER_IP:8090/?view=status
        widget:
          type: customapi
          url: http://SCANNER_IP:8090/api/status
          refreshInterval: 5000
          mappings:
            - field: printers.0.spool_desc
              label: Spool
            - field: printers.0.print_state
              label: State
